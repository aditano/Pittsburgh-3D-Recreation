<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Pittsburgh · Architecture · Meters</title>
    <link rel="icon" href="data:," />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="c"></canvas>
      <div class="crosshair" aria-hidden="true"></div>
      <div class="loader" id="loader">
        <div class="loader-bar"><span></span></div>
        <div class="loader-text">Generating Pittsburgh…</div>
      </div>
    </div>

    <header class="hud-tl">
      <div class="eyebrow">Architecture · Meters</div>
      <h1>Pittsburgh</h1>
      <p class="meta">
        OSM rivers, streets, parks, downtown footprints. +X east · +Y up · +Z south.
        Confluence = 0.
      </p>
    </header>

    <aside class="hud-tr">
      <div class="eyebrow">Layers</div>
      <div class="layers" id="layers">buildings · loading</div>
      <button type="button" class="settings-toggle" id="settings-toggle" aria-expanded="false" aria-controls="settings">
        Settings
      </button>
      <div class="settings-panel" id="settings" hidden>
        <div class="settings-kicker">Quality</div>
        <div class="seg" id="quality-seg" role="group" aria-label="Quality">
          <button type="button" data-quality="low">Low</button>
          <button type="button" data-quality="medium">Medium</button>
          <button type="button" data-quality="high">High</button>
          <button type="button" data-quality="ultra">Ultra</button>
        </div>
        <div class="settings-kicker">Resolution</div>
        <div class="seg" id="resolution-seg" role="group" aria-label="Resolution">
          <button type="button" data-resolution="50">50%</button>
          <button type="button" data-resolution="75">75%</button>
          <button type="button" data-resolution="100">100%</button>
          <button type="button" data-resolution="150">150%</button>
          <button type="button" data-resolution="200">200%</button>
        </div>
        <p class="settings-note">Lower either if the city stutters. Bloom stays off on phones.</p>
      </div>
    </aside>

    <nav class="hud-weather" id="weather" aria-label="Weather">
      <button type="button" data-weather="sunny" class="active">Sunny</button>
      <button type="button" data-weather="rain">Rain</button>
      <button type="button" data-weather="snow">Snow</button>
    </nav>

    <nav class="hud-nav" id="nav">
      <button type="button" data-view="aerial">Aerial</button>
      <button type="button" data-view="downtown" class="active">Downtown</button>
      <button type="button" data-view="point">The Point</button>
      <button type="button" data-view="bridges">Bridges</button>
      <button type="button" data-view="stadiums">Stadiums</button>
      <button type="button" data-view="oakland">Oakland</button>
      <button type="button" data-view="cathedral">Cathedral</button>
      <button type="button" data-view="mountwashington">Mt. Wash</button>
      <button type="button" data-view="rotate">Rotate</button>
    </nav>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
